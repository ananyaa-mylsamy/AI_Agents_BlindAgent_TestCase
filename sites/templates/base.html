<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FlyFinder{% endblock %} - FlyFinder</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f6f8; color: #1d2733; }
  header { background: #12406b; color: #fff; padding: 12px 24px; }
  header a { color: #fff; text-decoration: none; font-weight: bold; font-size: 22px; }
  main { max-width: 860px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
  .tabs a { display: inline-block; padding: 10px 18px; margin-right: 6px; border: 1px solid #c6d0da;
            border-bottom: none; border-radius: 6px 6px 0 0; text-decoration: none; color: #12406b; }
  .tabs a.active { background: #12406b; color: #fff; font-weight: bold; }
  .flight { display: flex; justify-content: space-between; align-items: center; border: 1px solid #dde3ea;
            border-radius: 6px; padding: 12px 16px; margin: 10px 0; }
  .price { font-size: 20px; font-weight: bold; }
  button, .btn { background: #1a73e8; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px;
                 font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
  .muted { color: #5b6773; font-size: 14px; }
  .error { color: #b00020; font-weight: bold; }
  .fares { display: flex; gap: 16px; }
  .fare { flex: 1; border: 1px solid #dde3ea; border-radius: 6px; padding: 16px; }
  label { display: block; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=date] { padding: 8px; width: 280px; }
</style>
</head>
<body>
<header><a href="/">FlyFinder</a></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
