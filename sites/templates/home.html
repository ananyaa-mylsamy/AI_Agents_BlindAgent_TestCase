{% extends "base.html" %}
{% block title %}Search flights{% endblock %}
{% block content %}
<h1>Search flights</h1>
<form action="/search" method="get">
  <p>Trip type: <strong>{{ s.trip }}</strong></p>
  <label for="origin">From</label>
  <input type="text" id="origin" name="origin" value="{{ s.origin }}">
  <span class="muted">{{ s.origin_name }}</span>
  <label for="destination">To</label>
  <input type="text" id="destination" name="destination" value="{{ s.destination }}">
  <span class="muted">{{ s.destination_name }}</span>
  <label for="date">Departure date</label>
  <input type="date" id="date" name="date" value="{{ s.date }}">
  <span class="muted">{{ s.date_label }}</span>
  <label for="adults">Adults</label>
  <input type="text" id="adults" name="adults" value="{{ s.adults }}">
  <p><button type="submit" id="search">Search</button></p>
</form>
{% endblock %}
